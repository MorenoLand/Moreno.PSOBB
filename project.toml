[wasm]
emcc           = "emcc"
global_base    = 0
initial_memory = 0x20000000
stack_size     = 0x1000000
guest_stack    = 0x800000
width          = 640
height         = 480
data_dir       = "data"
data_parts     = 4

[ida]
out        = "ida"
project    = "psobb"
signatures = ["vc32rtf", "vc32mfc", "vc32mfce", "vc7atl", "vc8atl", "vcseh", "vcextra",
              "vc32_14", "vc32ucrt", "mssdk32", "msmfc2", "msmfc2u", "msddk32", "ms32wdk", "pe", "exe"]

[analyzer]
command  = ""
provider = "ghidra"
timeout  = 900

[lift]
skip_categories = ["other"]
skip = []
wrap = []
extra = [0x85AB43, 0x83747A, 0x837481, 0x837488, 0x83748F, 0x837496, 0x83749D, 0x8374A4, 0x8374AB, 0x8374B2, 0x8374B9, 0x8374E8, 0x83750D, 0x7A628C, 0x864057, 0x819240, 0x81924C, 0x81930C]
data = []
chunk = 120
max_functions_per_file = 150

[classify]
ranges = []

[layout]
areas = [
  ["gui",    "Gui|Window|Dialog|Menu|Button|Scroll|Tab|Text|Popup|Tooltip|Slider|Hud|Cursor|Screen|Panel|Controls"],
  ["gfx",    "GL|DX|Render|Pixel|Image|Bitmap|Png|Jpeg|Gif|Dds|Dxt|Font|Draw|Color|Texture|Palette|Particle|Sprite|Shader|Display|Graphics|Camera"],
  ["net",    "Net|Client|Connector|Packet|HTTP|DNS|SSL|Crypto|Blowfish|MD5|Base64|Socket|Server|Download|Url|Web|Patch"],
  ["script", "Script|Event|Trigger|Npc|Quest|Class"],
  ["game",   "Game|Player|Level|Map|Item|Anim|Weapon|Body|Head|Enemy|Boss|Attack|Battle"],
  ["math",   "Point|Rect|Quat|Box|Matrix|Vec|Plane|Random|Math"],
  ["audio",  "Sound|Audio|Music|Wave|Mixer|Se"],
  ["core",   "Str|String|Array|List|File|Path|Dir|Registry|Debug|Console|Profile|Process|Time|Memory|Heap|Thread|Lock|Object|Resource|Cache|Stream|Input|Key|Mouse|App|Shell"],
]
