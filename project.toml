# PSOBB (Patch client) - static recompilation target.
# Addresses are absolute virtual addresses in the original 32-bit PE image.
# Copy the original client to PsoBB.exe here, or set SS_EXE to its path.
# SHA-256: f4d4bd463c07fec2542452735deb5237641634100d9223d2d0f0ae4000315cc0

[project]
name        = "PsoBB"
arch        = "x86"
exe         = "PsoBB.exe"
host_exe    = "PsoBBHost.exe"
host_name   = "PSOBB"
image_base  = 0x400000
entry       = 0x85AB43
pe_entry    = 0xB60000
code_lo     = 0x401000
code_hi     = 0x8CC000
image_end   = 0xB62000
guest_size  = 0x4000000
tail_size   = 0x400000
icon        = ""

[build]
mingw32 = "mingw32"
libs    = ["psapi", "winmm", "ole32", "gdi32", "user32", "shell32", "advapi32", "comdlg32", "winspool"]
resources = ""
cflags  = ["-O1", "-g", "-fno-omit-frame-pointer", "-w"]
stack   = 0x10000000
heap    = 0x10000000

[imports]
# The client links its CRT statically; every import is stdcall Win32.
cdecl_modules = []
libs = ["libkernel32.a", "libuser32.a", "libgdi32.a", "libshell32.a", "libole32.a",
        "libwinmm.a", "libcomdlg32.a", "libadvapi32.a", "libwinspool.a", "libdbghelp.a"]

